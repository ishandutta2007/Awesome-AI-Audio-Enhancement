<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#121026" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff0080" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6a11cb" />
      <stop offset="50%" stop-color="#2575fc" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes eqBar1 {
        0%, 100% { height: 18px; y: 350px; }
        50% { height: 65px; y: 303px; }
      }
      @keyframes eqBar2 {
        0%, 100% { height: 42px; y: 326px; }
        50% { height: 95px; y: 273px; }
      }
      @keyframes eqBar3 {
        0%, 100% { height: 70px; y: 298px; }
        50% { height: 28px; y: 340px; }
      }
      @keyframes eqBar4 {
        0%, 100% { height: 35px; y: 333px; }
        50% { height: 80px; y: 288px; }
      }
      @keyframes eqBar5 {
        0%, 100% { height: 55px; y: 313px; }
        50% { height: 20px; y: 348px; }
      }

      .ambient-glow {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .wave-anim {
        animation: waveFloat 4s ease-in-out infinite;
      }
      .bar-1 { animation: eqBar1 1.4s ease-in-out infinite alternate; }
      .bar-2 { animation: eqBar2 1.1s ease-in-out infinite alternate 0.2s; }
      .bar-3 { animation: eqBar3 1.6s ease-in-out infinite alternate 0.4s; }
      .bar-4 { animation: eqBar4 1.3s ease-in-out infinite alternate 0.1s; }
      .bar-5 { animation: eqBar5 1.5s ease-in-out infinite alternate 0.3s; }
      
      .badge-pill {
        transition: all 0.3s ease;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="250" cy="120" r="140" fill="#7928ca" filter="url(#glow)" class="ambient-glow" opacity="0.4" />
  <circle cx="950" cy="220" r="160" fill="#0070f3" filter="url(#glow)" class="ambient-glow" opacity="0.3" />
  <circle cx="600" cy="360" r="120" fill="#ff0080" filter="url(#glow)" class="ambient-glow" opacity="0.25" />

  <!-- Animated Equalizer Bars across the lower background -->
  <g fill="url(#barGrad)" opacity="0.75">
    <!-- Left Equalizer Cluster -->
    <rect x="60" y="320" width="8" height="48" rx="4" class="bar-1" />
    <rect x="76" y="300" width="8" height="68" rx="4" class="bar-2" />
    <rect x="92" y="315" width="8" height="53" rx="4" class="bar-3" />
    <rect x="108" y="295" width="8" height="73" rx="4" class="bar-4" />
    <rect x="124" y="330" width="8" height="38" rx="4" class="bar-5" />
    <rect x="140" y="310" width="8" height="58" rx="4" class="bar-2" />
    <rect x="156" y="335" width="8" height="33" rx="4" class="bar-1" />
    <rect x="172" y="305" width="8" height="63" rx="4" class="bar-4" />
    <rect x="188" y="325" width="8" height="43" rx="4" class="bar-3" />
    
    <!-- Right Equalizer Cluster -->
    <rect x="1000" y="325" width="8" height="43" rx="4" class="bar-3" />
    <rect x="1016" y="305" width="8" height="63" rx="4" class="bar-4" />
    <rect x="1032" y="335" width="8" height="33" rx="4" class="bar-1" />
    <rect x="1048" y="310" width="8" height="58" rx="4" class="bar-2" />
    <rect x="1064" y="330" width="8" height="38" rx="4" class="bar-5" />
    <rect x="1080" y="295" width="8" height="73" rx="4" class="bar-4" />
    <rect x="1096" y="315" width="8" height="53" rx="4" class="bar-3" />
    <rect x="1112" y="300" width="8" height="68" rx="4" class="bar-2" />
    <rect x="1128" y="320" width="8" height="48" rx="4" class="bar-1" />
  </g>

  <!-- Flowing Audio Waveform paths (decorative background waves) -->
  <g class="wave-anim" opacity="0.6">
    <path d="M 0,340 C 200,320 300,380 500,340 C 700,300 850,370 1000,330 C 1100,305 1150,335 1200,330" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" />
    <path d="M 0,355 C 220,375 320,325 520,355 C 720,385 870,320 1020,350 C 1120,370 1170,340 1200,345" fill="none" stroke="url(#primaryGrad)" stroke-width="1.8" opacity="0.7" />
  </g>

  <!-- Foreground Content (Cards & Texts) - Guaranteed High Visibility -->
  
  <!-- Top Category Pill / Tag -->
  <g transform="translate(600, 75)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
    <circle cx="-135" cy="0" r="5" fill="#00f2fe">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-120" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#00f2fe" letter-spacing="2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(600, 160)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome AI Audio Enhancement
    </text>
    <!-- Vibrant Underline Accent -->
    <rect x="-260" y="20" width="520" height="4" rx="2" fill="url(#primaryGrad)" />
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 222)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#b4bcd0" letter-spacing="0.2">
      Speech Enhancement • Noise Reduction • Voice Isolation • Studio Audio Restoration
    </text>
  </g>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(600, 280)">
    <!-- Pill 1 -->
    <g transform="translate(-370, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="rgba(138, 43, 226, 0.25)" stroke="#8a2be2" stroke-width="1.2" />
      <text x="82.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d8b4fe">🎙️ Voice Isolation</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-185, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="rgba(37, 117, 252, 0.25)" stroke="#2575fc" stroke-width="1.2" />
      <text x="82.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">🔇 Denoising &amp; NR</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="1.2" />
      <text x="90" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#67e8f9">🎚️ Studio Restoration</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="170" height="36" rx="18" fill="rgba(255, 0, 128, 0.2)" stroke="#ff0080" stroke-width="1.2" />
      <text x="85" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f472b6">⚡ Super-Resolution</text>
    </g>
  </g>
</svg>
